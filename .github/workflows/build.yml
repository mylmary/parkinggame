name: Build Mary's Parking Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parkinggame-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build game
        run: npm run build
      - name: Save built game
        uses: actions/upload-artifact@v4
        with:
          name: marys-parking-game-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
