<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8edf4">
<meta name="description" content="Mary's Parking Game — an endless car escape puzzle.">
<title>Mary's Parking Game</title>
<style>
:root{--ink:#594d65;--muted:#94869b;--pink:#f3b8d2;--mint:#a9d9c2;--blue:#b8d5f2;--yellow:#f5df9e;--lilac:#d1c1ed;--aqua:#b5e2df;--rose:#efb5b9;--peach:#f5c9ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#f8edf4}body{display:flex;justify-content:center;overscroll-behavior:none}.app{width:min(100%,560px);min-height:100svh;padding:env(safe-area-inset-top) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 1px}.brand{font-weight:1000;font-size:clamp(21px,6vw,29px);letter-spacing:-1px;color:#65546c}.brand span{color:#c47da5}.level{background:#fff9;border:0;border-radius:14px;padding:7px 11px;font-weight:900;font-size:12px}.stats{display:flex;gap:8px}.stat{background:#fff8;border:0;border-radius:12px;padding:6px 9px;font-size:11px;font-weight:800;color:var(--muted)}.stat strong{color:var(--ink);font-size:14px;margin-left:3px}.panel{background:#fff9fc;border:0;border-radius:21px;box-shadow:none;padding:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.section-head h2{font-size:12px;margin:0;font-weight:1000;letter-spacing:.3px}.hint{font-size:10px;color:var(--muted);font-weight:700}.queue-panel{padding:10px 12px}.queue-window{height:43px;overflow:hidden;position:relative}.queue-track{display:flex;align-items:center;gap:8px;width:max-content;animation:queueTravel 42s linear infinite}.queue-window:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#fff9fc 0%,transparent 7%,transparent 93%,#fff9fc 100%)}.person{flex:0 0 24px;height:36px;position:relative;display:flex;align-items:flex-end;justify-content:center;animation:personBob 1.4s ease-in-out infinite}.person:nth-child(3n){animation-delay:-.5s}.person .head{position:absolute;top:0;width:15px;height:15px;border-radius:50%;background:var(--c)}.person .body{width:20px;height:21px;border-radius:9px 9px 5px 5px;background:var(--c)}@keyframes queueTravel{from{transform:translateX(0)}to{transform:translateX(-35%)}}@keyframes personBob{50%{transform:translateY(-4px)}}.queue-count{font-size:10px;color:var(--muted);font-weight:800;white-space:nowrap}.pickup-panel{padding:10px 12px}.pickup-spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pickup-space{height:76px;border:1.5px dashed #d8c7d8;border-radius:12px;background:#faf5fa;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default;color:#b99bb7;font:inherit}.pickup-space:disabled{cursor:default;opacity:1}.slot-number{position:absolute;left:8px;top:5px;font-size:9px;font-weight:900;color:#c3b2c4}.slot-empty{font-size:25px;font-weight:400;opacity:.75}.pickup-car{width:72px;height:34px;border-radius:12px 14px 8px 8px;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -3px #0000000b;transition:transform .35s,opacity .35s}.pickup-car:before{content:"";position:absolute;left:17px;top:-9px;width:37px;height:16px;border-radius:8px 8px 2px 2px;background:inherit;filter:brightness(.98)}.pickup-car:after{content:"";position:absolute;left:24px;top:-5px;width:23px;height:10px;border-radius:5px 5px 1px 1px;background:#ffffffa8;z-index:1}.pickup-seat{position:relative;z-index:2;width:7px;height:10px;border-radius:5px 5px 2px 2px;background:#fff9;display:flex;align-items:flex-start;justify-content:center}.pickup-seat.filled{background:#fff}.pickup-seat .tiny-head{width:5px;height:5px;border-radius:50%;background:#9a7c99;margin-top:-3px}.pickup-seat .tiny-body{position:absolute;top:3px;width:6px;height:6px;border-radius:3px 3px 1px 1px;background:#9a7c99}.pickup-capacity{position:absolute;bottom:3px;right:6px;font-size:9px;font-weight:900;color:#88738b;background:#fff9;border-radius:6px;padding:1px 4px}.pickup-status{position:absolute;bottom:3px;left:6px;font-size:8px;font-weight:800;color:#88738b}.pickup-car.departing{transform:translateX(130%);opacity:0}.pickup-space.occupied{border-style:solid;border-color:#e7d9e8;background:#f7eff6}.pickup-space.occupied .slot-empty{display:none}.pickup-space.occupied{cursor:default}
.walking-passenger{position:fixed;z-index:50;width:20px;height:32px;display:block;pointer-events:none;transition:transform .68s cubic-bezier(.2,.65,.3,1),opacity .68s ease}
.walking-passenger .head{position:absolute;top:0;left:3px;width:14px;height:14px;border-radius:50%;background:#e7adbd}
.walking-passenger .body{position:absolute;top:12px;left:1px;width:18px;height:13px;border-radius:7px 7px 4px 4px;background:#d6a9d0}
.person-gap{flex:0 0 24px;height:36px;display:block;pointer-events:none}
.walking-passenger{animation:none!important}@media(min-width:480px){.app{gap:13px}.board{gap:5px;padding:6px}.panel{padding:14px}}
@media(prefers-reduced-motion:reduce){.queue-track,.person{animation:none}}

/* Responsive parking board and game controls */
.board{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;width:100%;max-width:440px;aspect-ratio:1/1;margin:2px auto 4px;padding:5px;border-radius:17px;background:#eadfea;overflow:hidden;isolation:isolate;touch-action:manipulation}
.cell{min-width:0;min-height:0;border-radius:7px;background:#fbf7fb;box-shadow:inset 0 1px 1px #ffffffb8}
.board-exit{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff9;color:#a98ca7;font-size:11px;font-weight:900;pointer-events:none}
.board-exit.top{top:-1px;left:calc(50% - 9px)}.board-exit.right{right:-1px;top:calc(50% - 9px)}.board-exit.bottom{bottom:-1px;left:calc(50% - 9px)}.board-exit.left{left:-1px;top:calc(50% - 9px)}
.car{z-index:2;display:flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:11px;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .22s ease,opacity .22s ease;outline-offset:2px}
.car:focus-visible{outline:2px solid #8b6d91}
.car-body{position:absolute;inset:12% 5%;border-radius:9px;background:var(--c);box-shadow:inset 0 -3px #0000000b,0 2px 3px #6d52631c}
.roof{position:absolute;inset:25% 22%;border-radius:6px;background:#ffffff8c;box-shadow:inset 0 0 0 1px #ffffff70}
.arrow{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:#fffdf2;color:#77647b;font-size:14px;font-weight:1000;line-height:1;box-shadow:0 1px 3px #6d526322}
.car.east .car-body,.car.west .car-body{inset:17% 5%}
.car.north .car-body,.car.south .car-body{inset:5% 17%}
.car.exiting{opacity:0;pointer-events:none}
.board-panel{padding:12px 10px 13px}
.message{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 13px;border-radius:13px;background:#fff9fc;color:#8c788f;font-size:12px;font-weight:800;line-height:1.35}
.controls{display:flex;justify-content:center}
.btn{min-height:42px;padding:10px 18px;border:0;border-radius:14px;background:#e9c5d9;color:#694e64;font:inherit;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #d8afc6;touch-action:manipulation}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #d8afc6}
.small{text-align:center;padding:0 8px;color:#a08fa2;font-size:10px;font-weight:700}
.overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#55445b66;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.dialog{width:min(100%,330px);padding:23px 20px 20px;border-radius:22px;background:#fff9fc;text-align:center;box-shadow:0 12px 40px #46344930}
.dialog h2{margin:0 0 8px;color:#765d75;font-size:22px}
.dialog p{margin:0 0 18px;color:#99899b;font-size:13px;line-height:1.5}
@media(max-width:360px){.app{padding-left:10px;padding-right:10px;gap:9px}.brand{font-size:20px}.panel{padding:9px}.queue-panel,.pickup-panel{padding:9px}.section-head h2{font-size:11px}.hint{font-size:9px}.pickup-space{height:68px}.board{gap:3px;padding:4px}.board-panel{padding:10px 7px}.arrow{width:18px;height:18px;font-size:12px}}
@media(min-width:700px){body{align-items:flex-start}.app{width:min(100%,600px);padding-top:18px}.board{max-width:460px}.panel{padding:15px}.board-panel{padding:15px 18px}}

</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand">Mary's <span>Parking</span> Game</div><div class="level" id="level">LEVEL 1</div></header>
<section class="panel queue-panel"><div class="section-head"><h2>PASSENGERS</h2></div><div class="queue-window"><div class="queue-track" id="queue"></div></div></section>
<section class="panel pickup-panel"><div class="section-head"><h2>PICK-UP SPACES</h2></div><div class="pickup-spaces"><button class="pickup-space" data-slot="0" aria-label="Pick-up space 1"><span class="slot-number">1</span><span class="slot-empty"></span></button><button class="pickup-space" data-slot="1" aria-label="Pick-up space 2"><span class="slot-number">2</span><span class="slot-empty"></span></button><button class="pickup-space" data-slot="2" aria-label="Pick-up space 3"><span class="slot-number">3</span><span class="slot-empty"></span></button></div></section>
<section class="panel board-panel"><div class="section-head"><h2 id="shapeName">CAT PARKING</h2></div><div class="board" id="board" aria-label="Six by six car parking puzzle board"></div></section>
<div class="message" id="message" aria-live="polite">Find a car with a clear path and tap to let it leave.</div>
<div class="controls"><button class="btn" id="reset">↻ Restart this level</button></div>

</main>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="dialogTitle">Lovely driving!</h2><p id="dialogText">The next parking shape is ready.</p><button class="btn" id="dialogButton">Continue</button></div></div>
<script>
(()=>{
const palette=['#a9d9c2','#f3b8d2','#b8d5f2','#f5df9e','#d1c1ed','#b5e2df','#efb5b9','#f5c9ad'];
// One compact car sits inside each occupied square. Each pattern is a recognizable 6×6 silhouette.
const patterns=[
{name:'BUTTERFLY PARKING',cells:[[0,0],[1,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[1,3],[2,3],[3,3],[4,3],[0,4],[1,4],[4,4],[5,4],[0,5],[1,5],[4,5],[5,5]]},
{name:'CROWN PARKING',cells:[[0,0],[2,0],[3,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[1,3],[2,3],[3,3],[4,3],[1,4],[2,4],[3,4],[4,4]]},
{name:'DIAMOND PARKING',cells:[[2,0],[3,0],[1,1],[2,1],[3,1],[4,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[1,3],[2,3],[3,3],[4,3],[2,4],[3,4],[2,5],[3,5]]},
{name:'SMILE PARKING',cells:[[1,0],[2,0],[3,0],[4,0],[0,1],[5,1],[0,2],[2,2],[3,2],[5,2],[0,3],[5,3],[1,4],[4,4],[2,5],[3,5]]}
];
const arrows={E:'➜',W:'⬅',N:'⬆',S:'⬇'};
let level=1,score=0,cars=[],initial=[],passengers=0,totalPassengers=0,boardedPassengers=0,transitioning=false,advanceTimer=null;
const $=id=>document.getElementById(id);
const directions=['E','W','N','S'];
function edgeDirection(x,y){
 const edges=[{d:'W',n:x},{d:'E',n:5-x},{d:'N',n:y},{d:'S',n:5-y}];
 edges.sort((a,b)=>a.n-b.n);
 return edges[0].d;
}
function buildLevel(){
 const pattern=patterns[(level-1)%patterns.length];
 // Point every car toward its nearest board edge. A car nearest to any edge
 // cannot have another car blocking that route; after it leaves, this remains true.
 cars=pattern.cells.map(([x,y],i)=>({id:i+1,x,y,d:edgeDirection(x,y),color:palette[(i+level-1)%palette.length],capacity:capacities[i%capacities.length],active:true}));
 clearPickupSlots();pendingPickupCar=null;initial=JSON.parse(JSON.stringify(cars));totalPassengers=cars.reduce((sum,car)=>sum+car.capacity,0);passengers=totalPassengers;boardedPassengers=0;transitioning=false;renderPassengerQueue();
 $('shapeName').textContent=pattern.name;$('overlay').classList.remove('show');
 $('message').textContent='Tap a car when the arrow points to a clear exit.';
 render();
}
function occupied(c){return c.y*6+c.x}
function isClear(car){
 const x=car.x,y=car.y;
 if(car.d==='E'){for(let xx=x+1;xx<6;xx++)if(blocked(xx,y,car))return false}
 if(car.d==='W'){for(let xx=x-1;xx>=0;xx--)if(blocked(xx,y,car))return false}
 if(car.d==='S'){for(let yy=y+1;yy<6;yy++)if(blocked(x,yy,car))return false}
 if(car.d==='N'){for(let yy=y-1;yy>=0;yy--)if(blocked(x,yy,car))return false}
 return true;
}
function blocked(x,y,car){return cars.some(other=>other.active&&other.id!==car.id&&other.x===x&&other.y===y)}
function ensureMoveAvailable(){
 const active=cars.filter(c=>c.active);
 if(!active.length||active.some(isClear))return;
 // A finite group of cars always has an outermost car in at least one row or column.
 // If a generated arrow layout ever traps every car, point the easiest car along a verified clear lane.
 let choice=null;
 for(const car of active){
  for(const d of directions){
   const previous=car.d;car.d=d;const clear=isClear(car);car.d=previous;
   if(!clear)continue;
   const distance=d==='E'?5-car.x:d==='W'?car.x:d==='S'?5-car.y:car.y;
   if(!choice||distance<choice.distance)choice={car,d,distance};
  }
 }
 if(choice){choice.car.d=choice.d;$('message').textContent='A clear route is available. Follow the arrow to keep going.'}
}
function render(){
 ensureMoveAvailable();
 const board=$('board');board.innerHTML='';
 for(let i=0;i<36;i++){const cell=document.createElement('div');cell.className='cell';board.append(cell)}
 ['top','right','bottom','left'].forEach(side=>{const e=document.createElement('span');e.className='board-exit '+side;e.textContent=({top:'↓',right:'→',bottom:'↑',left:'←'})[side];board.append(e)});
 cars.filter(c=>c.active).forEach(c=>{
  const b=document.createElement('button');b.className='car '+({E:'east',W:'west',N:'north',S:'south'}[c.d]);b.style.setProperty('--c',c.color);
  const boardWidth=board.clientWidth||400,pad=5,gap=4,cell=(boardWidth-pad*2-gap*5)/6;
  b.style.position='absolute';b.style.left=(pad+c.x*(cell+gap)+cell*.09)+'px';b.style.top=(pad+c.y*(cell+gap)+cell*.09)+'px';b.style.width=(cell*.82)+'px';b.style.height=(cell*.82)+'px';
  b.innerHTML='<i class="car-body"></i><i class="roof"></i><span class="arrow">'+arrows[c.d]+'</span>';
  b.setAttribute('aria-label','Car '+c.id+', points '+c.d+', '+(isClear(c)?'exit clear':'exit blocked'));
  b.addEventListener('click',()=>moveCar(c.id,b));board.append(b);
 });
 $('level').textContent='LEVEL '+level;
}
const pickupSlots=[null,null,null];const capacities=[4,6,8,6,4,8];const pickupColors=['#a9d9c2','#f3b8d2','#b8d5f2','#d1c1ed'];
function renderPassengerQueue(){
 const track=$('queue');track.innerHTML='';
 // Create enough passengers for every car, using that car's exact colour.
 cars.forEach((car,i)=>{
  const count=car.capacity;
  for(let n=0;n<count;n++){
   const p=document.createElement('div');p.className='person';p.style.setProperty('--c',car.color);
   p.innerHTML='<i class="head"></i><i class="body"></i>';track.append(p);
  }
 });
}
let pendingPickupCar=null;
function renderPickupSlot(index){
 const slot=document.querySelector('[data-slot="'+index+'"]');const item=pickupSlots[index];if(!slot)return;
 slot.innerHTML='<span class="slot-number">'+(index+1)+'</span>';
 if(!item){slot.classList.remove('occupied');slot.disabled=true;slot.innerHTML+='<span class="slot-empty"></span>';slot.setAttribute('aria-label','Empty pick-up space '+(index+1));return}
 slot.classList.add('occupied');slot.disabled=true;
 const car=document.createElement('span');car.className='pickup-car'+(item.departing?' departing':'');car.style.background=item.carColor||pickupColors[item.color%pickupColors.length];
 for(let i=0;i<item.capacity;i++){const seat=document.createElement('i');seat.className='pickup-seat'+(i<item.filled?' filled':'');if(i<item.filled)seat.innerHTML='<i class="tiny-head"></i><i class="tiny-body"></i>';car.append(seat)}
 slot.append(car);
 const cap=document.createElement('span');cap.className='pickup-capacity';cap.textContent=item.filled+'/'+item.capacity;slot.append(cap);
 const status=document.createElement('span');status.className='pickup-status';status.textContent=item.departing?'On the way':'Boarding';slot.append(status);
 slot.setAttribute('aria-label','Car with '+item.capacity+' seats, '+item.filled+' passengers aboard');
}
function animatePassenger(index,seatIndex,carColor){
 const windowRect=$('queue').getBoundingClientRect();
 const source=[...$('queue').querySelectorAll('.person')].find(person=>{
  const color=getComputedStyle(person).getPropertyValue('--c').trim();
  const rect=person.getBoundingClientRect();
  return color.toLowerCase()===carColor.toLowerCase()&&rect.right>windowRect.left&&rect.left<windowRect.right;
 });
 const target=document.querySelector('[data-slot="'+index+'"] .pickup-seat.filled');
 if(!source||!target)return false;
 const start=source.getBoundingClientRect();
 const end=target.getBoundingClientRect();
 const color=getComputedStyle(source).getPropertyValue('--c').trim()||'#e7adbd';
 const gap=document.createElement('span');gap.className='person-gap';gap.setAttribute('aria-hidden','true');
 source.replaceWith(gap);
 const walker=document.createElement('span');
 walker.className='walking-passenger';
 walker.innerHTML='<i class="head"></i><i class="body"></i>';
 walker.style.setProperty('--c',color);
 walker.querySelector('.head').style.background=color;
 walker.querySelector('.body').style.background=color;
 walker.style.left=start.left+'px';
 walker.style.top=start.top+'px';
 document.body.append(walker);
 const dx=end.left+end.width/2-(start.left+start.width/2);
 const dy=end.top+end.height/2-(start.top+start.height/2);
 requestAnimationFrame(()=>{walker.style.transform='translate('+dx+'px,'+dy+'px) scale(.65)';walker.style.opacity='.15'});
 setTimeout(()=>walker.remove(),750);
 return true;
}
function callPickupCar(index){
 if(pickupSlots[index]||!pendingPickupCar)return;
 const sourceCar=pendingPickupCar;pendingPickupCar=null;
 const capacity=sourceCar.capacity;
 const item={capacity,filled:0,color:sourceCar.id,carColor:sourceCar.color,departing:false,timer:null};
 pickupSlots[index]=item;renderPickupSlot(index);
 item.timer=setInterval(()=>{
  if(pickupSlots[index]!==item||item.departing){clearInterval(item.timer);return}
  item.filled++;renderPickupSlot(index);
  if(!animatePassenger(index,item.filled-1,item.carColor)){
   item.filled--;renderPickupSlot(index);
   $('message').textContent='Waiting for a matching-colour passenger to reach the pick-up point.';
   return;
  }
  boardedPassengers++;passengers=Math.max(0,totalPassengers-boardedPassengers);
  if(item.filled>=item.capacity){
   item.departing=true;renderPickupSlot(index);clearInterval(item.timer);
   setTimeout(()=>{if(pickupSlots[index]===item){pickupSlots[index]=null;renderPickupSlot(index)}},650);
   if(boardedPassengers>=totalPassengers)setTimeout(()=>completeLevel(),760);
  }
 },850);
}
function sendCarToPickup(car){
 const emptyIndex=pickupSlots.findIndex(slot=>!slot);
 if(emptyIndex<0)return false;
 pendingPickupCar=car;callPickupCar(emptyIndex);return true;
}
pickupSlots.forEach((_,index)=>renderPickupSlot(index));
function moveCar(id,el){
 if(transitioning)return;
 const car=cars.find(c=>c.id===id&&c.active);if(!car)return;
 if(!isClear(car)){$('message').textContent='This car is blocked. Clear the cars in front of its arrow first.';return}
 el.classList.add('exiting');car.active=false;score+=10;passengers=Math.max(0,passengers-1);
 $('message').textContent='Clear road! The car is driving away.';
 setTimeout(()=>{render();if(cars.every(c=>!c.active))completeLevel()},280);
}
function moveCar(id,el){
 if(transitioning)return;
 const car=cars.find(c=>c.id===id&&c.active);if(!car)return;
 if(!isClear(car)){$('message').textContent='This car is blocked. Clear the cars in front of its arrow first.';return}
 const emptyIndex=pickupSlots.findIndex(slot=>!slot);
 if(emptyIndex<0){$('message').textContent='All three pick-up spaces are occupied. Wait for a car to collect its passengers.';return}
 el.classList.add('exiting');car.active=false;score+=10;
 pendingPickupCar=car;callPickupCar(emptyIndex);
 $('message').textContent='Car parked in pick-up space '+(emptyIndex+1)+'. Passengers are boarding.';
 setTimeout(()=>{render();if(cars.every(c=>!c.active)&&pickupSlots.every(slot=>!slot))completeLevel()},280);
}
function clearPickupSlots(){
 pickupSlots.forEach((item,index)=>{if(item?.timer)clearInterval(item.timer);pickupSlots[index]=null;renderPickupSlot(index)});
}
function completeLevel(){
 if(transitioning)return;transitioning=true;
 $('dialogTitle').textContent='Shape cleared!';$('dialogText').textContent='You cleared every car. Moving on to the next parking shape…';
 $('dialogButton').textContent='Continue';$('overlay').classList.add('show');
 // Automatically continue so the game feels like one continuous journey.
 advanceTimer=setTimeout(()=>{if(transitioning)nextLevel()},1100);
}
function nextLevel(){if(advanceTimer)clearTimeout(advanceTimer);advanceTimer=null;level++;buildLevel()}
function restart(){if(advanceTimer)clearTimeout(advanceTimer);advanceTimer=null;clearPickupSlots();pendingPickupCar=null;transitioning=false;cars=JSON.parse(JSON.stringify(initial));passengers=totalPassengers;boardedPassengers=0;$('overlay').classList.remove('show');$('message').textContent='Find a car with a clear path and tap to let it leave.';renderPassengerQueue();render()}
